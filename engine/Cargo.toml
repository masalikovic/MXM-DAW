# Workspace Rust mesin MXM-DAW (rencana §8.3).
#
#   daw-render ──▶ daw-core ◀── daw-ffi ◀── Flutter (app/)
#                     ▲            │
#                     └── daw-io ◀─┘
#
# daw-core: model, sequencer, voices, DSP, FX. Tanpa I/O (ADR-0001, ADR-0002).
# daw-render: CLI untuk merender proyek/kit ke WAV, golden test, benchmark.
# daw-ffi: API untuk Flutter lewat flutter_rust_bridge (ADR-0004).
# daw-io: membaca sampel (WAV) dari byte; tanpa akses sistem berkas.
[workspace]
resolver = "3"
members = ["crates/daw-core", "crates/daw-ffi", "crates/daw-io", "crates/daw-render"]

# Nilai bersama; tiap crate mewarisinya dengan `xxx.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/masalikovic/MXM-DAW"
publish = false

[workspace.dependencies]
daw-core = { path = "crates/daw-core" }
daw-io = { path = "crates/daw-io" }
# Versi dikunci persis (`=`): crate Rust, paket Dart `flutter_rust_bridge`
# di app/pubspec.yaml, dan alat flutter_rust_bridge_codegen di CI harus
# memakai versi yang sama (ADR-0004). Ubah ketiganya bersamaan.
flutter_rust_bridge = "=2.13.0"
# Antrean SPSC bebas-lock UI → thread audio (rencana §8.5).
rtrb = "0.4.0"
# Tes: alokasi di jalur render = tes gagal (rencana §12).
assert_no_alloc = "1.1.2"
# Menulis WAV dari CLI daw-render.
hound = "3.5.1"
# Berkas proyek JSON (ADR-0007), hanya di daw-io.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# Lint bersama. `warn` di sini menjadi error di CI karena clippy dijalankan
# dengan `-D warnings` (rencana §13.2).
[workspace.lints.rust]
missing_docs = "warn"
# Makro flutter_rust_bridge memakai cfg `frb_expand`; daftarkan supaya
# compiler tidak menganggapnya salah ketik.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
