[package]
name = "daw-ffi"
description = "API mesin MXM-DAW untuk Flutter (flutter_rust_bridge, ADR-0004)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# cdylib: pustaka bersama untuk tes Flutter di host (Linux).
# staticlib: untuk Android; CMake menggabungkannya dengan adapter C++ menjadi
#   satu libmxm_engine.so (ADR-0003).
# lib: supaya `cargo test` dan clippy bisa memeriksa crate ini seperti biasa.
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
daw-core.workspace = true
flutter_rust_bridge.workspace = true

[lints]
workspace = true
