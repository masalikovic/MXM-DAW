# Aturan analisis Dart. CI menjalankan `flutter analyze --fatal-infos`,
# jadi temuan sekecil apa pun menggagalkan CI (rencana §13.2).
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    # Kode hasil flutter_rust_bridge_codegen; CI memeriksa ia tidak basi.
    - lib/engine/bridge/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
