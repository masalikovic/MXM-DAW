# CI MXM-DAW (rencana §13.3).
#
# Job ditambahkan per langkah M0:
#   engine   Rust: fmt, clippy pedantic, test, CLI, cargo-deny   (M0 langkah 2)
#   app      Flutter: codegen FRB, format, analyze, test           (M0 langkah 3, 5)
#   android  cargo-ndk → CMake → APK rilis, cek izin/ABI/ukuran   (M0 langkah 6)
#   preview  APK pratinjau bertanda tangan di Releases (main)     (M0 langkah 7)
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Push baru ke PR yang sama membatalkan run lama: hemat menit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: Rust · fmt, clippy, test, cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5

      # rustup membaca engine/rust-toolchain.toml lalu memasang versi
      # dan komponen yang tercantum.
      - name: Pasang toolchain dari rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: cargo-engine-${{ runner.os }}-${{ hashFiles('engine/rust-toolchain.toml', 'engine/Cargo.lock') }}

      - name: Format (rustfmt)
        run: cargo fmt --all --check

      - name: Lint (clippy pedantic, peringatan = error)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tes
        run: cargo test --workspace --locked

      - name: Smoke test daw-render --version
        run: cargo run --locked -p daw-render -- --version

      # Lisensi, celah keamanan, dan sumber dependensi (ADR-0010, deny.toml).
      - name: Pasang cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: Cek dependensi (cargo-deny)
        run: cargo deny --locked check

  app:
    name: Flutter · codegen, format, analyze, test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      # Rust dibutuhkan untuk generator flutter_rust_bridge dan untuk
      # membangun pustaka daw-ffi yang dimuat tes Dart (ADR-0004).
      - name: Pasang toolchain Rust dari rust-toolchain.toml
        working-directory: engine
        run: rustup toolchain install && rustup show active-toolchain

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: cargo-app-${{ runner.os }}-${{ hashFiles('engine/rust-toolchain.toml', 'engine/Cargo.lock') }}

      # Versi Flutter dibaca dari `environment.flutter` di app/pubspec.yaml,
      # jadi hanya ada satu tempat untuk mengubahnya.
      - name: Pasang Flutter dari pubspec.yaml
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: app/pubspec.yaml
          cache: true

      - name: Versi Flutter
        run: flutter --version

      # --enforce-lockfile: gagal bila pubspec.lock tidak cocok, bukan diam-diam
      # memperbaruinya (versi dependensi dikunci, rencana §8.5).
      - name: Dependensi (pubspec.lock)
        run: flutter pub get --enforce-lockfile

      # flutter_rust_bridge_codegen harus sama dengan flutter_rust_bridge di
      # engine/Cargo.toml dan app/pubspec.yaml (ADR-0004). Generator memakai
      # cargo-expand; bila tidak ada, ia memasang versi terbaru sendiri dari
      # internet. Versinya dikunci di sini supaya hasil CI bisa diulang.
      - name: Pasang flutter_rust_bridge_codegen dan cargo-expand
        uses: taiki-e/install-action@v2
        with:
          tool: flutter_rust_bridge_codegen@2.13.0,cargo-expand@1.0.127

      # Generator dijalankan ulang; hasilnya harus sama persis dengan yang
      # di-commit. Bila berbeda, seseorang mengubah api.rs tanpa menjalankan
      # generator, atau mengedit kode hasil generator dengan tangan.
      - name: Kode hasil generator tidak basi
        run: |
          flutter_rust_bridge_codegen generate
          berubah=$(git status --porcelain -- lib/engine/bridge ../engine/crates/daw-ffi/src)
          if [ -n "$berubah" ]; then
            echo "::error::Kode hasil flutter_rust_bridge_codegen basi. Jalankan 'flutter_rust_bridge_codegen generate' di app/ lalu commit."
            echo "$berubah"
            git diff -- lib/engine/bridge ../engine/crates/daw-ffi/src
            exit 1
          fi

      - name: Format (dart format)
        run: dart format --output=none --set-exit-if-changed .

      - name: Analisis (temuan sekecil apa pun = gagal)
        run: flutter analyze --fatal-infos

      # Pustaka host yang dimuat test/engine/rust_bridge_test.dart.
      - name: Bangun daw-ffi untuk tes host
        working-directory: engine
        run: cargo build --locked -p daw-ffi

      - name: Tes (widget + jembatan Rust)
        run: flutter test

  # APK lengkap: Rust (cargo-ndk) + C++ (CMake) → libmxm_engine.so → APK
  # (ADR-0003). APK diperiksa tools/cek-apk.sh lalu diunggah sebagai artefak.
  # Runner GitHub sudah membawa Android SDK; NDK dipasang sesuai build.gradle.kts.
  android:
    name: Android · cargo-ndk, CMake, APK rilis, cek izin/ABI/ukuran
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Kunci pratinjau milik pemilik hanya dipakai untuk push ke main
    # (ADR-0012). PR selalu memakai kunci debug, jadi kode yang belum
    # di-merge tidak pernah ditandatangani kunci asli.
    env:
      KUNCI_B64: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.MXMDAW_PRATINJAU_KEYSTORE_B64 || '' }}
      APK: app/build/app/outputs/flutter-apk/app-pratinjau-release.apk
    outputs:
      jenis_kunci: ${{ steps.kunci.outputs.jenis }}
    steps:
      - uses: actions/checkout@v5

      # Android Gradle Plugin 9 butuh JDK 17 atau lebih baru.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Juga memasang target aarch64-linux-android dari rust-toolchain.toml.
      - name: Pasang toolchain Rust dari rust-toolchain.toml
        working-directory: engine
        run: rustup toolchain install && rustup show active-toolchain

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: cargo-android-${{ runner.os }}-${{ hashFiles('engine/rust-toolchain.toml', 'engine/Cargo.lock') }}

      - name: Pasang Flutter dari pubspec.yaml
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: app/pubspec.yaml
          cache: true

      - name: Dependensi (pubspec.lock)
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Pasang cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2

      # cargo-ndk dan Gradle harus memakai NDK yang sama. Versinya dibaca dari
      # ndkVersion di app/android/app/build.gradle.kts (satu sumber).
      - name: Pasang Android NDK sesuai build.gradle.kts
        run: |
          ndk=$(sed -n 's/^ *ndkVersion = "\(.*\)"/\1/p' app/android/app/build.gradle.kts)
          test -n "$ndk"
          echo "NDK $ndk"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >>"$GITHUB_ENV"

      # Pemeriksa APK dites dulu dengan APK tiruan: pemeriksa yang tidak
      # pernah gagal tidak membuktikan apa-apa.
      - name: Tes pemeriksa APK (tools/tes-cek-apk.sh)
        run: tools/tes-cek-apk.sh

      - name: Tes pemeriksa tanda tangan (tools/tes-cek-tanda-tangan.sh)
        run: tools/tes-cek-tanda-tangan.sh

      # Tiga jenis kunci (ADR-0012), keystore selalu di folder sementara runner,
      # tidak pernah dicetak, dan dihapus di akhir job:
      #   pemilik   : push ke main + secret ada → APK diterbitkan
      #   sementara : PR → kunci sekali pakai dibuat di sini, supaya jalur
      #               tanda tangan (Gradle + apksigner) teruji sebelum merge
      #   tidak-ada : push ke main tanpa secret → kunci debug, tidak diterbitkan
      - name: Siapkan kunci tanda tangan
        id: kunci
        env:
          SANDI_PEMILIK: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.MXMDAW_PRATINJAU_PASSWORD || '' }}
          ALIAS_PEMILIK: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.MXMDAW_PRATINJAU_ALIAS || '' }}
        run: |
          ks="$RUNNER_TEMP/kunci.jks"
          if [ -n "$KUNCI_B64" ]; then
            printf '%s' "$KUNCI_B64" | base64 -d >"$ks"
            sandi="$SANDI_PEMILIK"; alias="$ALIAS_PEMILIK"; jenis=pemilik
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "::warning::Secret MXMDAW_PRATINJAU_KEYSTORE_B64 belum diatur; APK ditandatangani kunci debug dan tidak diterbitkan (docs/panduan-kunci-pratinjau.md)."
            echo "jenis=tidak-ada" >>"$GITHUB_OUTPUT"
            exit 0
          else
            sandi="$(openssl rand -hex 24)"; alias=sementara; jenis=sementara
            echo "::add-mask::$sandi"
            keytool -genkeypair -keystore "$ks" -storetype PKCS12 -alias "$alias" \
              -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Kunci sementara CI" \
              -storepass "$sandi" -keypass "$sandi" >/dev/null 2>&1
            keytool -list -v -keystore "$ks" -alias "$alias" -storepass "$sandi" |
              sed -n 's/^[[:space:]]*SHA256: //p' >"$RUNNER_TEMP/sidik-sementara.txt"
          fi
          {
            echo "MXMDAW_KEYSTORE=$ks"
            echo "MXMDAW_KEYSTORE_PASSWORD=$sandi"
            echo "MXMDAW_KEY_ALIAS=$alias"
          } >>"$GITHUB_ENV"
          echo "jenis=$jenis" >>"$GITHUB_OUTPUT"

      # Nomor build = nomor run CI, selalu naik, jadi APK baru bisa dipasang
      # di atas yang lama (rencana §13.4).
      - name: Build APK pratinjau arm64-v8a (tools/build-android.sh)
        run: tools/build-android.sh --build-number=${{ github.run_number }}

      - name: Hapus keystore dari runner
        if: always()
        run: rm -f "$RUNNER_TEMP/kunci.jks"

      - name: Periksa APK (izin, libmxm_engine.so, ABI, ekspor Rust, ukuran)
        run: tools/cek-apk.sh "$APK"

      - name: Periksa tanda tangan = kunci pratinjau pemilik
        if: steps.kunci.outputs.jenis == 'pemilik'
        run: tools/cek-tanda-tangan.sh "$APK"

      - name: Periksa tanda tangan = kunci sementara (menguji jalurnya di PR)
        if: steps.kunci.outputs.jenis == 'sementara'
        env:
          SIDIK_KUNCI: ${{ runner.temp }}/sidik-sementara.txt
        run: tools/cek-tanda-tangan.sh "$APK"

      - name: Unggah APK sebagai artefak
        uses: actions/upload-artifact@v6
        with:
          name: mxm-daw-arm64-v8a
          path: ${{ env.APK }}
          retention-days: 14
          if-no-files-found: error

  # Setiap merge ke main yang lulus semua job: pre-release preview-<build>
  # berisi APK bertanda tangan kunci pratinjau + SHA-256 (rencana §13.4).
  preview:
    name: Pratinjau · terbitkan APK di Releases
    needs: [engine, app, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.android.outputs.jenis_kunci == 'pemilik'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mxm-daw-arm64-v8a

      - name: Terbitkan pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          NOMOR: ${{ github.run_number }}
        run: |
          berkas="mxm-daw-preview-$NOMOR-arm64-v8a.apk"
          mv app-pratinjau-release.apk "$berkas"
          sha256sum "$berkas" >"$berkas.sha256"
          cat "$berkas.sha256"
          {
            echo "APK pratinjau MXM-DAW, build $NOMOR, commit $GITHUB_SHA."
            echo
            echo "- Untuk HP Android 8.1+ arm64-v8a. ID: io.github.masalikovic.mxmdaw.preview"
            echo "- Ditandatangani kunci pratinjau pemilik; sidik jari di tools/sidik-kunci-pratinjau.txt"
            echo "- SHA-256: \`$(cut -d' ' -f1 "$berkas.sha256")\`"
            echo
            echo "Cara memasang: README.md, bagian \"Memasang di HP\"."
          } >catatan.md
          gh release create "preview-$NOMOR" "$berkas" "$berkas.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Pratinjau $NOMOR" --notes-file catatan.md
